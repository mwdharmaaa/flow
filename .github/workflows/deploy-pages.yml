name: Deploy Flow Web to GitHub Pages

on:
  push:
    branches:
      - main
      - devv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Scaffold Flutter Web Platform
        run: |
          if [ ! -d "web" ]; then
            flutter create . --org com.flow --project-name flow --platforms=web
          fi
          rm -f test/widget_test.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Flutter Web Release
        run: flutter build web --release --base-href "/flow/"

      - name: Bundle flow.apk to Web Distribution
        run: |
          if [ -f "flow.apk" ]; then
            cp flow.apk build/web/flow.apk
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
