name: Build Flow APK & Deploy Web

on:
  push:
    branches:
      - main
      - devv
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'distribution'
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Scaffold Flutter Android Skeleton
        run: |
          rm -rf android
          flutter create . --org com.flow --project-name flow --platforms=android

      - name: Configure Android App Icon with Flow Branding
        run: |
          for dir in android/app/src/main/res/mipmap-*; do
            cp web/icons/Icon-192.png "$dir/ic_launcher.png"
            cp web/icons/Icon-192.png "$dir/ic_launcher_round.png" 2>/dev/null || true
          done
          echo "[OK] Injected official Flow waves icon into Android launcher mipmaps"

      - name: Configure Android Permissions and Recognition Services
        run: |
          python3 -c '
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = """    <!-- Audio recording & internet permissions for speech recognition -->
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <!-- Android 11+ query intents for SpeechRecognition services -->
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
          """
          if "RECORD_AUDIO" not in content:
              content = content.replace("<application", permissions + "    <application", 1)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("[OK] Successfully injected RECORD_AUDIO and SpeechRecognition queries into AndroidManifest.xml")
          else:
              print("[OK] Permissions already present in AndroidManifest.xml")
          '

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Output
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-release.apk build-output/flow.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flow-apk
          path: build-output/flow.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devv'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.4-${{ github.sha }}
          name: Flow Release v2.0.4 (Flutter Native)
          make_latest: true
          body: |
            ## Flow - Personal Finance Tracker (Flutter Native APK)
            - Rebuilt 100% with Flutter & Dart
            - Native Android Speech-to-Text with continuous listening, cloud engine parity, and Indonesian locale lock
            - Official Flow waves launcher icon branded on Android
            - ZERO LOGIN: Akses langsung tanpa registrasi, tanpa otentikasi, tanpa server
            - Semua fitur premium terbuka bebas (Multi-dompet, anggaran, analitik, rutin, hutang/piutang)
            - Download `flow.apk` di bawah dan pasang langsung di HP Android.
          files: build-output/flow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Standalone APK to Repository
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devv'
        run: |
          cp build-output/flow.apk flow.apk
          git config user.name "mwdharmaaa"
          git config user.email "mwdharmaaa@users.noreply.github.com"
          git add flow.apk
          if ! git diff-index --quiet HEAD; then
            git commit -m "build(apk): sync standalone flow.apk with release v2.0.2-${{ github.sha }} [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

  deploy-pages:
    needs: build-apk
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: flow-apk
          path: build-output

      - name: Scaffold Flutter Web Platform
        run: |
          if [ ! -d "web" ]; then
            flutter create . --org com.flow --project-name flow --platforms=web
          fi
          rm -f test/widget_test.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Flutter Web Release
        run: flutter build web --release --base-href "/flow/"

      - name: Bundle Fresh flow.apk to Web Distribution
        run: |
          cp build-output/flow.apk build/web/flow.apk
          echo "[OK] Successfully bundled freshly built flow.apk to build/web/flow.apk"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
