name: Build Flow APK (Flutter)

on:
  push:
    branches:
      - main
      - devv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Scaffold Flutter Android Skeleton
        run: |
          rm -rf android
          flutter create . --org com.flow --project-name flow --platforms=android

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Output
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-release.apk build-output/flow.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flow-apk
          path: build-output/flow.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devv'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-${{ github.sha }}
          name: Flow Release v2.0.0 (Flutter Native)
          body: |
            ## Flow - Personal Finance Tracker (Flutter Native APK)
            - Rebuilt 100% with Flutter & Dart
            - ZERO LOGIN: Akses langsung tanpa registrasi, tanpa otentikasi, tanpa server
            - Semua fitur premium terbuka bebas (Multi-dompet, anggaran, analitik, rutin, hutang/piutang)
            - Download `flow.apk` di bawah dan pasang langsung di HP Android.
          files: build-output/flow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
