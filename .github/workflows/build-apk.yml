name: Build Flow APK

on:
  push:
    branches:
      - main
      - devv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/flow.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flow-apk
          path: build-output/flow.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devv'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.sha }}
          name: Flow Release v1.0.0
          body: |
            ## Flow - Personal Finance Tracker (Standalone APK)
            - 100% Offline-first local database (no external telemetry or servers)
            - All premium features fully unlocked (unlimited accounts, budgets, analytics, export)
            - Download `flow.apk` below and install directly on your Android device.
          files: build-output/flow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
